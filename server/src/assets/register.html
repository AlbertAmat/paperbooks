<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Books - Register</title>
    <style>
        body {
            background-color: rgb(250, 250, 250);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-image: url("./background.png");
            background-color: #1c7ff1;
            background-size: contain;
        }
        .register-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
        }
        .register-container h2 { margin-bottom: 20px; }
        .input-group {
            position: relative;
            display: flex;
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            background: none;
            border: none;
        }
        .register-btn {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 30px;
        }
        .error-message {
            color: red;
            margin-bottom: 10px;
            height: 20px;
            font-size: 14px;
        }
        .success-message {
            color: #1c7a1c;
            background: #eaf7ea;
            border: 1px solid #cdeacd;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: left;
            display: none;
        }
        .success-message a {
            color: #007bff;
        }
    </style>
</head>
<body>
<div class="register-container">
    <h2>Paper Books - Register</h2>

    <div class="success-message" id="success-message">
        Your account has been created. An administrator needs to review and
        approve it before you can log in — you'll be able to sign in once
        that happens.
        <br><br>
        <a href="/login">Go to login</a>
    </div>

    <form id="registerForm" action="/register" method="POST">
        <div class="input-group">
            <input type="text" name="name" placeholder="Name" required>
        </div>
        <div class="input-group">
            <input type="email" name="email" placeholder="Email" required>
        </div>
        <div class="input-group">
            <input type="text" name="userName" placeholder="User code" required>
        </div>
        <div class="input-group">
            <input type="password" name="password" id="password" placeholder="Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('password')">👁️</button>
        </div>
        <div class="input-group">
            <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</button>
        </div>

        <div class="error-message" id="error-message" style="display: none;"></div>

        <button type="submit" class="register-btn">Register</button>
    </form>
</div>

<script>
    function togglePassword(id) {
        const field = document.getElementById(id);
        field.type = field.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('registerForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const form = this;
        const name = form.name.value;
        const email = form.email.value;
        const userName = form.userName.value;
        const password = form.password.value;
        const confirmPassword = form.confirmPassword.value;
        const errorMessage = document.getElementById('error-message');

        if (password !== confirmPassword) {
            errorMessage.innerText = "Passwords do not match.";
            errorMessage.style.display = "block";
            return;
        }

        try {
            const response = await fetch("/register", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ name, email, userName, password })
            });

            const data = await response.json();

            if (!response.ok) {
                errorMessage.innerText = data.message || "Registration failed";
                errorMessage.style.display = "block";
                return;
            }

            errorMessage.style.display = "none";
            form.style.display = "none";
            document.getElementById('success-message').style.display = "block";

        } catch (error) {
            errorMessage.innerText = error;
            //errorMessage.innerText = "An error occurred. Please try again.";
            errorMessage.style.display = "block";
            console.error("Registration error:", error);
        }
    });
</script>
</body>
</html>
